name: Build localization installer

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $lock = Get-Content -LiteralPath 'third-party.lock.json' -Raw | ConvertFrom-Json
          $values = [ordered]@{
            KRKRPATCH_COMMIT = [string]$lock.krkrPatch.commit
            VCPKG_TRIPLET = [string]$lock.vcpkg.triplet
            NUGET_CLIENT_VERSION = [string]$lock.nuget.clientVersion
            NUGET_CLIENT_URL = [string]$lock.nuget.clientUrl
            NUGET_CLIENT_SHA256 = [string]$lock.nuget.clientSha256
            NUGET_SOURCE = [string]$lock.nuget.source
            INNO_VERSION = [string]$lock.innoSetup.version
            INNO_RELEASE_REPOSITORY = [string]$lock.innoSetup.releaseRepository
            INNO_RELEASE_TAG = [string]$lock.innoSetup.releaseTag
            INNO_ASSET = [string]$lock.innoSetup.asset
            INNO_SHA256 = [string]$lock.innoSetup.sha256
          }
          foreach ($entry in $values.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing dependency lock value: $($entry.Key)"
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)" -Encoding utf8
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "KRKRPATCH_SOURCE_ARCHIVE=KrkrPatch-source-$($values.KRKRPATCH_COMMIT)-localization-patched.zip" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'THIRD_PARTY_LICENSE_ARCHIVE=ThirdPartyLicenses.zip' -Encoding utf8

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          vs-version: '[17.0,18.0)'

      - name: Install verified NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $nuget = Join-Path $env:RUNNER_TEMP "nuget-$env:NUGET_CLIENT_VERSION.exe"
          Invoke-WebRequest -Uri $env:NUGET_CLIENT_URL -OutFile $nuget
          $actualHash = (Get-FileHash -LiteralPath $nuget -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:NUGET_CLIENT_SHA256) {
            throw "NuGet checksum mismatch: $actualHash"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $nuget
          if ($signature.Status -ne 'Valid') {
            throw "NuGet Authenticode signature is $($signature.Status)."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NUGET_EXE=$nuget" -Encoding utf8

      - name: Fetch verified third-party dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $destination = Join-Path $env:RUNNER_TEMP 'dependencies'
          & 'Distribution/source/scripts/Get-Dependencies.ps1' -Components KrkrPatch,Vcpkg -DestinationPath $destination -GitHubEnvironmentPath $env:GITHUB_ENV

      - name: Apply KrkrPatch SteamStub compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          & 'Distribution/source/scripts/Apply-KrkrPatchCompatibilityPatch.ps1' -KrkrPatchRoot $env:KRKRPATCH_ROOT

      - name: Restore KrkrPatch dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $manifestRoot = (Resolve-Path -LiteralPath $env:KRKRPATCH_ROOT).Path
          $vcpkgRoot = (Resolve-Path -LiteralPath $env:VCPKG_ROOT).Path
          $installedRoot = Join-Path $manifestRoot 'vcpkg_installed'
          $solution = Join-Path $manifestRoot 'KrkrPatch.sln'
          $packagesRoot = Join-Path $manifestRoot 'packages'

          & $env:NUGET_EXE restore $solution -PackagesDirectory $packagesRoot -Source $env:NUGET_SOURCE -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE."
          }

          $lock = Get-Content -LiteralPath 'third-party.lock.json' -Raw | ConvertFrom-Json
          foreach ($package in $lock.nuget.packages.PSObject.Properties) {
            $identity = $package.Name -split '/', 2
            if ($identity.Count -ne 2) {
              throw "Invalid NuGet package lock key: $($package.Name)"
            }
            $packageName = "$($identity[0]).$($identity[1])"
            $packagePath = Join-Path $packagesRoot "$packageName/$packageName.nupkg"
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Missing restored NuGet package: $packagePath"
            }
            $expected = [string]$package.Value
            if (-not $expected.StartsWith('sha512-', [StringComparison]::Ordinal)) {
              throw "Unsupported NuGet hash format for $($package.Name)."
            }
            $bytes = [IO.File]::ReadAllBytes($packagePath)
            $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($bytes))
            if ($actual -cne $expected.Substring(7)) {
              throw "NuGet package checksum mismatch: $($package.Name)"
            }
          }

          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          & $vcpkg install --triplet $env:VCPKG_TRIPLET "--x-manifest-root=$manifestRoot" "--x-install-root=$installedRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg restore failed with exit code $LASTEXITCODE."
          }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg integration failed with exit code $LASTEXITCODE."
          }

      - name: Collect source and dependency licenses
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $manifestRoot = (Resolve-Path -LiteralPath $env:KRKRPATCH_ROOT).Path
          $installedRoot = Join-Path $manifestRoot 'vcpkg_installed'
          $licenseRoot = Join-Path $env:RUNNER_TEMP 'release-licenses'
          $sourceArchive = Join-Path $env:GITHUB_WORKSPACE "Distribution/$env:KRKRPATCH_SOURCE_ARCHIVE"
          $licenseArchive = Join-Path $env:GITHUB_WORKSPACE "Distribution/$env:THIRD_PARTY_LICENSE_ARCHIVE"

          $actualCommit = (& git -C $manifestRoot rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:KRKRPATCH_COMMIT) {
            throw "Unexpected KrkrPatch revision: $actualCommit"
          }
          $modifiedFiles = @(& git -C $manifestRoot diff --name-only)
          $diffExitCode = $LASTEXITCODE
          $expectedModifiedFiles = @('KrkrPatch/dllmain.cpp')
          $unexpectedFiles = @($modifiedFiles | Where-Object { $_ -cnotin $expectedModifiedFiles })
          $missingFiles = @($expectedModifiedFiles | Where-Object { $_ -cnotin $modifiedFiles })
          if ($diffExitCode -ne 0 -or $unexpectedFiles.Count -gt 0 -or $missingFiles.Count -gt 0) {
            throw "Unexpected KrkrPatch source modifications: $($modifiedFiles -join ', ')"
          }

          $sourceStageParent = Join-Path $env:RUNNER_TEMP 'release-source'
          $sourceStageRoot = Join-Path $sourceStageParent "KrkrPatch-$env:KRKRPATCH_COMMIT-localization-patched"
          if (Test-Path -LiteralPath $sourceStageParent) {
            Remove-Item -LiteralPath $sourceStageParent -Recurse -Force
          }
          [IO.Directory]::CreateDirectory($sourceStageRoot) | Out-Null

          $trackedFiles = @(& git -C $manifestRoot ls-files)
          if ($LASTEXITCODE -ne 0 -or $trackedFiles.Count -eq 0) {
            throw 'KrkrPatch tracked-source enumeration failed.'
          }
          foreach ($relativePath in $trackedFiles) {
            $sourcePath = Join-Path $manifestRoot $relativePath
            $destinationPath = Join-Path $sourceStageRoot $relativePath
            [IO.Directory]::CreateDirectory((Split-Path $destinationPath -Parent)) | Out-Null
            Copy-Item -LiteralPath $sourcePath -Destination $destinationPath
          }

          $patchesDestination = Join-Path $sourceStageRoot 'localization-patches'
          Copy-Item -LiteralPath 'Distribution/source/patches' -Destination $patchesDestination -Recurse

          $buildSupportRoot = Join-Path $sourceStageRoot 'localization-build-support'
          $buildSupportFiles = @(
            '.github/workflows/release.yml',
            'LICENSE',
            'third-party.lock.json',
            'Distribution/LICENSES/THIRD-PARTY-NOTICES.txt',
            'Distribution/source/README.md',
            'Distribution/source/installer/LocalizationSetup.iss',
            'Distribution/source/proxy/SteamApiProxy.cpp',
            'Distribution/source/proxy/SteamApiProxy.def',
            'Distribution/source/proxy/SteamApiProxy.vcxproj',
            'Distribution/source/scripts/Get-Dependencies.ps1',
            'Distribution/source/scripts/Apply-KrkrPatchCompatibilityPatch.ps1'
          )
          foreach ($relativePath in $buildSupportFiles) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $destinationPath = Join-Path $buildSupportRoot $relativePath
            [IO.Directory]::CreateDirectory((Split-Path $destinationPath -Parent)) | Out-Null
            Copy-Item -LiteralPath $sourcePath -Destination $destinationPath
          }
          $buildSupportPatches = Join-Path $buildSupportRoot 'Distribution/source/patches'
          [IO.Directory]::CreateDirectory((Split-Path $buildSupportPatches -Parent)) | Out-Null
          Copy-Item -LiteralPath 'Distribution/source/patches' -Destination $buildSupportPatches -Recurse

          foreach ($relativePath in @('KrkrPatch/dllmain.cpp')) {
            $compiledSource = Join-Path $manifestRoot $relativePath
            $archivedSource = Join-Path $sourceStageRoot $relativePath
            $compiledHash = (Get-FileHash -LiteralPath $compiledSource -Algorithm SHA256).Hash
            $archivedHash = (Get-FileHash -LiteralPath $archivedSource -Algorithm SHA256).Hash
            if ($compiledHash -cne $archivedHash) {
              throw "Archived KrkrPatch source does not match the compiled source: $relativePath"
            }
          }

          if (Test-Path -LiteralPath $sourceArchive) {
            Remove-Item -LiteralPath $sourceArchive -Force
          }
          Compress-Archive -LiteralPath $sourceStageRoot -DestinationPath $sourceArchive -CompressionLevel Optimal

          [IO.Directory]::CreateDirectory($licenseRoot) | Out-Null
          Copy-Item -LiteralPath 'Distribution/LICENSES' -Destination (Join-Path $licenseRoot 'repository') -Recurse

          $krkrLicenseRoot = Join-Path $licenseRoot 'KrkrPatch'
          [IO.Directory]::CreateDirectory($krkrLicenseRoot) | Out-Null
          Copy-Item -LiteralPath (Join-Path $manifestRoot 'LICENSE.txt') -Destination (Join-Path $krkrLicenseRoot 'LICENSE.txt')

          $vcpkgLicenseRoot = Join-Path $licenseRoot 'vcpkg'
          [IO.Directory]::CreateDirectory($vcpkgLicenseRoot) | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:VCPKG_ROOT 'LICENSE.txt') -Destination (Join-Path $vcpkgLicenseRoot 'vcpkg.txt')
          $vcpkgShareRoot = Join-Path $installedRoot "$env:VCPKG_TRIPLET/share"
          $vcpkgLicenses = @(Get-ChildItem -LiteralPath $vcpkgShareRoot -Filter copyright -File -Recurse)
          if ($vcpkgLicenses.Count -eq 0) {
            throw 'No vcpkg dependency licenses were found.'
          }
          foreach ($file in $vcpkgLicenses) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $vcpkgLicenseRoot "$($file.Directory.Name).txt")
          }

          $packagesRoot = Join-Path $manifestRoot 'packages'
          $nugetLicenseRoot = Join-Path $licenseRoot 'nuget'
          [IO.Directory]::CreateDirectory($nugetLicenseRoot) | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $metadataCount = 0
          foreach ($package in Get-ChildItem -LiteralPath $packagesRoot -Filter '*.nupkg' -File -Recurse) {
            $targetRoot = Join-Path $nugetLicenseRoot $package.BaseName
            [IO.Directory]::CreateDirectory($targetRoot) | Out-Null
            $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              foreach ($entry in $archive.Entries) {
                if ($entry.FullName -notmatch '(?i)(\.nuspec$|(^|/)(license|copying|notice|copyright)(\.|$))') {
                  continue
                }
                $targetName = [IO.Path]::GetFileName($entry.FullName)
                if ([string]::IsNullOrWhiteSpace($targetName)) {
                  continue
                }
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $targetRoot $targetName), $true)
                $metadataCount++
              }
            } finally {
              $archive.Dispose()
            }
          }
          if ($metadataCount -eq 0) {
            throw 'No NuGet dependency license metadata was found.'
          }

          Compress-Archive -Path (Join-Path $licenseRoot '*') -DestinationPath $licenseArchive -CompressionLevel Optimal
          foreach ($file in @($sourceArchive, $licenseArchive)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing release archive: $file"
            }
          }

      - name: Build KrkrPatch Win32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $manifestRoot = (Resolve-Path -LiteralPath $env:KRKRPATCH_ROOT).Path
          $installedRoot = Join-Path $manifestRoot 'vcpkg_installed'
          $solution = Join-Path $manifestRoot 'KrkrPatch.sln'
          $arguments = @(
            $solution,
            '/m',
            '/p:Configuration=Release',
            '/p:Platform=x86',
            "/p:VcpkgTriplet=$env:VCPKG_TRIPLET",
            '/p:VcpkgManifestInstall=false',
            "/p:VcpkgInstalledDir=$installedRoot",
            "/p:VcpkgRoot=$env:VCPKG_ROOT"
          )
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "KrkrPatch build failed with exit code $LASTEXITCODE."
          }
          Copy-Item -LiteralPath (Join-Path $manifestRoot 'Build/KrkrPatchLoader/Win32/Release/KrkrPatchLoader.exe') -Destination 'Distribution/payload/KrkrPatchLoader.exe' -Force
          Copy-Item -LiteralPath (Join-Path $manifestRoot 'Build/KrkrPatch/Win32/Release/KrkrPatch.dll') -Destination 'Distribution/payload/KrkrPatch.dll' -Force

      - name: Build Steam API proxy Win32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $project = 'Distribution/source/proxy/SteamApiProxy.vcxproj'
          & msbuild $project /m /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) {
            throw "Steam API proxy build failed with exit code $LASTEXITCODE."
          }
          Copy-Item -LiteralPath 'Distribution/source/proxy/bin/Release/steam_api.dll' -Destination 'Distribution/payload/steam_api.dll' -Force

      - name: Validate release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $files = @(
            'Distribution/payload/KrkrPatchLoader.exe',
            'Distribution/payload/KrkrPatch.dll',
            'Distribution/payload/KrkrPatch.json',
            'Distribution/payload/localization.xp3',
            'Distribution/payload/steam_api.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing payload file: $file"
            }
          }
          foreach ($file in @('Distribution/payload/KrkrPatchLoader.exe', 'Distribution/payload/KrkrPatch.dll', 'Distribution/payload/steam_api.dll')) {
            $stream = [IO.File]::OpenRead($file)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              if ($reader.ReadUInt16() -ne 0x14c) {
                throw "$file is not x86."
              }
            } finally {
              $stream.Dispose()
            }
          }

          $config = Get-Content -LiteralPath 'Distribution/payload/KrkrPatch.json' -Raw | ConvertFrom-Json
          if ([int]$config.logLevel -ne 1) {
            throw 'Release KrkrPatch logLevel must be 1.'
          }
          if ([string]$config.gameExecutableFile -cne 'KugayamaShiorisDeathDiary.exe' -or
              [string]$config.steamAppId -cne '4141950') {
            throw 'KrkrPatch launcher configuration is incomplete.'
          }
          $manifest = Get-Content -LiteralPath 'Distribution/source/scenarios.json' -Raw | ConvertFrom-Json
          if (-not [bool]$config.patchNoProtocol) {
            throw 'KrkrPatch must accept bare scenario storage paths.'
          }

          $proxySource = Get-Content -LiteralPath 'Distribution/source/proxy/SteamApiProxy.cpp' -Raw
          $proxyDefinition = Get-Content -LiteralPath 'Distribution/source/proxy/SteamApiProxy.def' -Raw
          $installerSource = Get-Content -LiteralPath 'Distribution/source/installer/LocalizationSetup.iss' -Raw
          if ($installerSource -notmatch '(?m)^DisableDirPage=no\s*$' -or
              $installerSource -notmatch '(?m)^Name:\s*"steamintegration";' -or
              $installerSource -notmatch 'MessagesFile:\s*"compiler:Languages\\Russian\.isl"') {
            throw 'Installer must show the game-folder page and offer Steam startup in Russian.'
          }
          $forwarders = @($proxyDefinition -split '\r?\n' | Where-Object { $_ -match '=' })
          if ($forwarders.Count -ne 1069) {
            throw "Steam API proxy must contain 1069 forwarders, found $($forwarders.Count)."
          }
          for ($index = 0; $index -lt $forwarders.Count; $index++) {
            $match = [regex]::Match($forwarders[$index], '^\s*(\S+)=steam_api_original\.(\S+)\s+@(\d+)\s*$')
            if (-not $match.Success -or
                $match.Groups[1].Value -cne $match.Groups[2].Value -or
                [int]$match.Groups[3].Value -ne ($index + 1)) {
              throw "Invalid Steam API forwarder: $($forwarders[$index])"
            }
          }
          if (-not $proxySource.Contains('StartLocalizationWorker();', [StringComparison]::Ordinal)) {
            throw 'Steam API localization startup worker is missing.'
          }
          foreach ($expectedHash in @([string]$manifest.gameExecutableSha256, [string]$manifest.sourceArchiveSha256, [string]$manifest.steamApiSha256)) {
            if ($expectedHash.Length -ne 64 -or
                $proxySource.IndexOf($expectedHash, [StringComparison]::OrdinalIgnoreCase) -lt 0 -or
                $installerSource.IndexOf($expectedHash, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Runtime compatibility hash is inconsistent: $expectedHash"
            }
          }

      - name: Install verified Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          gh release download $env:INNO_RELEASE_TAG --repo $env:INNO_RELEASE_REPOSITORY --pattern $env:INNO_ASSET --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup download failed with exit code $LASTEXITCODE."
          }
          $installer = Join-Path $env:RUNNER_TEMP $env:INNO_ASSET
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:INNO_SHA256) {
            throw "Inno Setup checksum mismatch: $actual"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Build LocalizationSetup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $version = if ('${{ github.event.release.tag_name }}') { '${{ github.event.release.tag_name }}'.TrimStart('v') } else { '0.0.0-dev' }
          $innoMajorVersion = ([Version]$env:INNO_VERSION).Major
          $compiler = Join-Path $env:ProgramFiles "Inno Setup $innoMajorVersion/ISCC.exe"
          $proxyHash = (Get-FileHash -LiteralPath 'Distribution/payload/steam_api.dll' -Algorithm SHA256).Hash
          & $compiler "/DMyAppVersion=$version" "/DSteamApiProxySha256=$proxyHash" '/ODistribution' '/FLocalizationSetup' 'Distribution/source/installer/LocalizationSetup.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create release checksums
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $assets = @(
            'Distribution/LocalizationSetup.exe',
            (Join-Path 'Distribution' $env:KRKRPATCH_SOURCE_ARCHIVE),
            (Join-Path 'Distribution' $env:THIRD_PARTY_LICENSE_ARCHIVE)
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'Distribution/SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload main build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalizationSetup-main-${{ github.run_number }}
          path: Distribution/LocalizationSetup.exe
          if-no-files-found: error

      - name: Upload release workflow artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: |
            Distribution/LocalizationSetup.exe
            Distribution/KrkrPatch-source-*.zip
            Distribution/ThirdPartyLicenses.zip
            Distribution/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach assets to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $assets = @(
            'Distribution/LocalizationSetup.exe',
            (Join-Path 'Distribution' $env:KRKRPATCH_SOURCE_ARCHIVE),
            (Join-Path 'Distribution' $env:THIRD_PARTY_LICENSE_ARCHIVE)
          )
          & gh release upload '${{ github.event.release.tag_name }}' @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Release upload failed with exit code $LASTEXITCODE."
          }

      - name: Write checksums to release description
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $releaseJson = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Release lookup failed with exit code $LASTEXITCODE."
          }
          $release = $releaseJson | ConvertFrom-Json
          foreach ($asset in @($release.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })) {
            & gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
            if ($LASTEXITCODE -ne 0) {
              throw "Removing the old checksum attachment failed with exit code $LASTEXITCODE."
            }
          }

          $rows = foreach ($line in Get-Content -LiteralPath 'Distribution/SHA256SUMS.txt') {
            $match = [regex]::Match($line, '^([0-9a-f]{64})  (.+)$')
            if (-not $match.Success) {
              throw "Invalid checksum line: $line"
            }
            '| `{0}` | `{1}` |' -f $match.Groups[2].Value, $match.Groups[1].Value
          }
          $startMarker = '<!-- localization-checksums:start -->'
          $endMarker = '<!-- localization-checksums:end -->'
          $blockLines = @(
            $startMarker,
            '## SHA-256',
            '',
            '| File | SHA-256 |',
            '| --- | --- |'
          ) + @($rows) + @($endMarker)
          $block = $blockLines -join "`n"
          $body = [string]$release.body
          $oldBlockPattern = '(?s)(?:\r?\n)*' + [regex]::Escape($startMarker) +
            '.*?' + [regex]::Escape($endMarker) + '(?:\r?\n)*'
          $body = [regex]::Replace($body, $oldBlockPattern, '').TrimEnd()
          if ($body.Length -gt 0) {
            $body += "`n`n"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $body + $block + "`n", [Text.UTF8Encoding]::new($false))
          & gh release edit $env:RELEASE_TAG --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Release description update failed with exit code $LASTEXITCODE."
          }
